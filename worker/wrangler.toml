# Cloudflare Worker för Viktresan: fotoanalys av mat och påminnelser i telefonen.
# Cloudflare hämtar koden från GitHub (mappen worker/) och publicerar automatiskt.
# AI-nyckeln läggs som hemlighet ANTHROPIC_API_KEY i Cloudflare, aldrig här.
name = "viktresan-server"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "KV"
id = "13120fccee834aeea934be12c526d7a4"

[[d1_databases]]
binding = "DB"
database_name = "viktresan"
database_id = "a3c30d60-6eec-4b8d-acd7-b8b33c0ec117"

# Påminnelser skickas var 5:e minut.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
