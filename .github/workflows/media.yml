name: Hämta filmer till startsidan

# Laddar ner fria filmklipp (Mixkit Stock Video Free License – kommersiellt ok, ingen källhänvisning krävs),
# gör dem små för mobilen och sparar dem i assets/video/. Då hämtas inget från andra sajter när någon besöker sidan.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/media.yml

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installera ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Ladda ner och komprimera
        run: |
          set -euo pipefail
          mkdir -p assets/video
          get () { # $1 = namn, $2 = adress
            curl -fsSL "$2" -o "/tmp/$1-src.mp4"
            # Mobilversion: 720 px hög, utan ljud, snabbstart på webben
            ffmpeg -y -loglevel error -i "/tmp/$1-src.mp4" -an -vf "scale=-2:720,fps=24" -c:v libx264 -profile:v high -preset slow -crf 28 -pix_fmt yuv420p -movflags +faststart "assets/video/$1.mp4"
            ffmpeg -y -loglevel error -i "/tmp/$1-src.mp4" -an -vf "scale=-2:720,fps=24" -c:v libvpx-vp9 -b:v 0 -crf 38 -row-mt 1 "assets/video/$1.webm"
            # Stillbild som visas innan filmen startar (och för den som valt "minska rörelse")
            ffmpeg -y -loglevel error -ss 1 -i "/tmp/$1-src.mp4" -frames:v 1 -vf "scale=-2:720" -q:v 4 "assets/video/$1.jpg"
          }
          get jogga "https://assets.mixkit.co/videos/52133/52133-720.mp4"
          get trana "https://assets.mixkit.co/active_storage/video_items/100532/1725383994/100532-video-720.mp4"
          ls -la assets/video
      - name: Spara i repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add assets/video
          git diff --cached --quiet && echo "Inget nytt." && exit 0
          git commit -m "Filmer till startsidan (Mixkit, fri licens)"
          git push
