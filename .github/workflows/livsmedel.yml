name: Hämta livsmedel

# Laddar ner Livsmedelsverkets databas till data/livsmedel.json.
# Körs när skriptet ändras, en gång i månaden, eller när man trycker "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch-livsmedel.mjs
      - .github/workflows/livsmedel.yml
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-livsmedel.mjs
      - name: Spara filen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/livsmedel.json
          if git diff --cached --quiet; then echo "Inget nytt"; exit 0; fi
          git commit -m "Uppdatera livsmedel från Livsmedelsverket"
          git push
