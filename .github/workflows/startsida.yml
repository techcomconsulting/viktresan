name: Uppdatera startsidan för Google

# Lägger startsidans text i index.html när startsidan ändras.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - js/views/landing.js
      - js/brand.js
      - scripts/prerender.mjs

permissions:
  contents: write

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-default-type=module scripts/prerender.mjs
      - name: Spara filen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Inget nytt"; exit 0; fi
          git commit -m "Uppdatera startsidan i index.html"
          git push
