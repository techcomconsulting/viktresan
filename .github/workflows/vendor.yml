name: Hämta jsPDF

# Laddar ner jsPDF (för att skapa PDF i appen) och lägger den i js/vendor.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hämta filer
        run: |
          mkdir -p js/vendor
          curl -fsSL https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js -o js/vendor/jspdf.umd.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/jspdf@2.5.2/LICENSE -o js/vendor/jspdf-LICENSE.txt
          mkdir -p assets/fonts
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/figtree/Figtree%5Bwght%5D.ttf" -o assets/fonts/Figtree.ttf
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/figtree/OFL.txt" -o assets/fonts/Figtree-OFL.txt
          ls -la js/vendor
      - name: Spara
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/vendor assets/fonts
          if git diff --cached --quiet; then echo "Inget nytt"; exit 0; fi
          git commit -m "Hämta jsPDF och typsnittet Figtree"
          git push
