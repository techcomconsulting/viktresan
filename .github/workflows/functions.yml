name: Publicera server (fotoanalys)

# Publicerar mappen functions/ till Firebase.
# Kräver hemligheten FIREBASE_SA (servicekontot) och, första gången, ANTHROPIC_API_KEY.
# Kör den för hand (Run workflow) för att spara en ny AI-nyckel.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - functions/**
      - firebase.json

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: viktresan-25170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA }}

      - name: Installera
        run: |
          cd functions && npm install --no-audit --no-fund
          npm install -g firebase-tools --no-audit --no-fund

      - name: Spara AI-nyckeln
        if: github.event_name == 'workflow_dispatch'
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "Ingen ANTHROPIC_API_KEY i GitHub. Hoppar över."; exit 0; fi
          printf '%s' "$KEY" > key.txt
          firebase functions:secrets:set ANTHROPIC_API_KEY --data-file key.txt --project "$PROJECT" --non-interactive --force
          rm -f key.txt

      - name: Publicera
        run: firebase deploy --only functions --project "$PROJECT" --non-interactive --force
